[project]
name = "navtab-server"
version = "0.2.0"
description = "FastAPI backend for NavTab"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "argon2-cffi>=23.1,<26",
  "asyncmy>=0.2,<1",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.6,<3",
  "PyJWT>=2.9,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.30,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
